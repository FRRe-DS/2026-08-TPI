services:
  db-k6:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m9_reservas
    volumes:
      - ./sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d m9_reservas"]
      interval: 5s
      timeout: 5s
      retries: 10

  jwks-mock:
    image: node:24-alpine
    environment:
      PORT: 8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ds-2026-realm
      KEYCLOAK_CLIENT_ID: grupo-08
    volumes:
      - ./k6/jwks-mock.js:/app/jwks-mock.js:ro
    command: ["node", "/app/jwks-mock.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api-k6:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8089
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db-k6:5432/m9_reservas
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ds-2026-realm
      KEYCLOAK_CLIENT_ID: grupo-08
      KEYCLOAK_JWKS_URI: http://jwks-mock:8080/realms/ds-2026-realm/protocol/openid-connect/certs
      ANTICIPACION_MINIMA_MINUTOS: 30
      ANTICIPACION_MAXIMA_DIAS: 30
      USE_EXTERNAL_MOCKS: "true"
    ports:
      - "8089:8089"
    depends_on:
      db-k6:
        condition: service_healthy
      jwks-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8089/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["run"]
    environment:
      BASE_URL: http://api-k6:8089
      JWKS_MOCK_URL: http://jwks-mock:8080
      K6_VUS: ${K6_VUS:-10}
      K6_DURATION: ${K6_DURATION:-15s}
    volumes:
      - ./k6:/scripts:ro
    command: ["run", "/scripts/reservas-load.js"]
    depends_on:
      api-k6:
        condition: service_healthy
